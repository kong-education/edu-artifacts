_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: httproute.kong.kongair-routes.0
  name: httproute.kong.kongair-routes.0
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: httproute.kong.kongair-routess.0.0
    path_handling: v0
    paths:
    - /routes
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000