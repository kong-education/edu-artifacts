volumes:
    kong_data_lab: {}

services:
  kong-lab-ollama:
    image: ollama/ollama:0.3.3
    ports:
      - "11434:11434/tcp"
    restart: always
    container_name: kong-lab-ollama
    networks:
      - kong-net
  kong-lab-postgres:
    image: postgres:9.6
    restart: always
    container_name: kong-lab-postgres
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: kong

  kong-lab-migrations:
    image: kong/kong-gateway:3.7.1.2
    container_name: kong-lab-migrations
    command: kong migrations bootstrap
    depends_on:
      - kong-lab-postgres
    environment:
      KONG_DATABASE: postgres
      KONG_PASSWORD: admin
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_PG_HOST: kong-lab-postgres
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
    networks:
      - kong-net
    restart: on-failure

  kong-lab-gw:
    image: kong/kong-gateway:3.7.1.2
    container_name: kong-lab-gw
    networks:
      - kong-net
    depends_on:
      - kong-lab-postgres
      - kong-lab-migrations
    restart: on-failure
    ports:
      - "443:8443/tcp"
      - "30501:8444/tcp"
      - "30500:8445/tcp"
      - "18443:8443/tcp"
      - "18444:8444/tcp"
      - "18445:8445/tcp"
    environment:
      KONG_PG_DATABASE: ${KONG_PG_DATABASE:-kong}
      KONG_ADMIN_GUI_LISTEN:  0.0.0.0:8002, 0.0.0.0:8445 ssl http2
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_URL: ${KONG_ADMIN_GUI_URL}
      KONG_ADMIN_GUI_API_URL: ${KONG_ADMIN_GUI_API_URL}
      KONG_SSL_CERT: /etc/kong/ssl/server.crt
      KONG_SSL_CERT_KEY: /etc/kong/ssl/server.key
      KONG_ADMIN_SSL_CERT: /etc/kong/ssl/server.crt
      KONG_ADMIN_SSL_CERT_KEY: /etc/kong/ssl/server.key
      KONG_ADMIN_GUI_SSL_CERT: /etc/kong/ssl/server.crt
      KONG_ADMIN_GUI_SSL_CERT_KEY: /etc/kong/ssl/server.key
      KONG_LOG_LEVEL: debug
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-lab-postgres
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kong}
      KONG_PG_USER: ${KONG_PG_USER:-kong}
    volumes:
      - /etc/kong/ssl:/etc/kong/ssl
      - /etc/kong/license.json:/etc/kong/license.json
networks:
  kong-net:
    name: kong-net
    driver: bridge
