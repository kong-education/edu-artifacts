    kuma:
      nameOverride: kong-mesh
      # The default registry and tag to use for all Kuma images
      global:
        image:
          registry: "docker.io/kong"
          tag: "$KONG_MESH_VERSION"
    
      controlPlane:
        image:
          repository: "kuma-cp"
          pullPolicy: IfNotPresent
    
        # -- Kuma CP log level: one of off,info,debug
        logLevel: "info"
    
        # -- Kuma CP modes: one of standalone,zone,global
        mode: "standalone"
    
        autoScaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 2
    
        injectorFailurePolicy: "Ignore"
    
        service:
          
          # -- Annotations to put on the Kuma Control Plane
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "5680"
          
          # -- Service type of the Kuma Control Plane
          type: NodePort
          apiServer:
            http:
              nodePort: 30002
            https:
              nodePort: 30003
        
        defaults:
          # -- Whether or not to skip creating the default Mesh
          skipMeshCreation: false
            
        secrets:
        - Env: "KMESH_LICENSE_INLINE"
          Secret: "kong-mesh-license"
          Key: "license.json"        
    
        webhooks:
          validator:
            additionalRules: |
              - apiGroups:
                  - kuma.io
                apiVersions:
                  - v1alpha1
                operations:
                  - CREATE
                  - UPDATE
                  - DELETE
                resources:
                  - opapolicies
          ownerReference:
            additionalRules: |
              - apiGroups:
                  - kuma.io
                apiVersions:
                  - v1alpha1
                operations:
                  - CREATE
                resources:
                  - opapolicies
      # Configuration for the kuma dataplane sidecar
      dataPlane:
        image:
          repository: "kuma-dp"
    
        # Configuration for the kuma init phase in the sidecar
        initImage:
          repository: "kuma-init"