kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080 # KIC
    protocol: TCP
  - containerPort: 30443
    hostPort: 30443 # KIC
    protocol: TCP
  - containerPort: 30005
    hostPort: 30005 # GRAFANA
    protocol: TCP
  - containerPort: 30006
    hostPort: 30006 # PROMETHEUS
    protocol: TCP
