version: "3"

volumes:
  kong_data: {}

services:

  konnect-dp:
    image: docker.io/kong/kong-gateway:3.4
    container_name: konnect-dp
    hostname: konnect-dp
    networks:
      - kong-konnect
    environment:
      KONG_ROLE: "data_plane"
      KONG_DATABASE: "off"
      KONG_CLUSTER_MTLS: "pki"
      KONG_CLUSTER_CONTROL_PLANE: "8bb74ff34e.us.cp0.konghq.com:443"
      KONG_CLUSTER_SERVER_NAME: "8bb74ff34e.us.cp0.konghq.com"
      KONG_CLUSTER_TELEMETRY_ENDPOINT: "8bb74ff34e.us.tp0.konghq.com:443"
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: "8bb74ff34e.us.tp0.konghq.com"
      KONG_CLUSTER_CERT: /var/kong/certs/cluster.crt
      KONG_CLUSTER_CERT_KEY: /var/kong/certs/cluster.key
      KONG_SSL_CERT: /var/kong/certs/server.crt
      KONG_SSL_CERT_KEY: /var/kong/certs/server.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_STREAM_LISTEN: "0.0.0.0:5555, 0.0.0.0:5556 ssl reuseport backlog=65536"
      KONG_STATUS_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /var/kong/logs/proxy_access.log
      KONG_PROXY_ERROR_LOG: /var/kong/logs/proxy_error.log
      KONG_PROXY_STREAM_ACCESS_LOG: /var/kong/logs/proxystream_access.log basic
      KONG_PROXY_STREAM_ERROR_LOG: /var/kong/logs/proxystream_error.log
      KONG_ALLOW_DEBUG_HEADER: "on"
      KONG_TRACING: "on"
      KONG_TRACING_WRITING_STRATEGY: "file"
      KONG_TRACING_TYPES: "all"
      KONG_TRACING_TIME_THRESHOLD: 0
      KONG_TRACING_WRITE_ENDPOINT: /var/kong/logs/granular_tracing.log
      KONG_TRACING_DEBUG_HEADER: X-Trace
      KONG_ADMIN_ACCESS_LOG: /var/kong/logs/admin_access.log
      KONG_ADMIN_ERROR_LOG: /var/kong/logs/admin_error.log
      KONG_ADMIN_GUI_ACCESS_LOG: /var/kong/logs/admingui_access.log
      KONG_ADMIN_GUI_ERROR_LOG: /var/kong/logs/admingui_error.log
      KONG_PORTAL_API_ACCESS_LOG: /var/kong/logs/portalapi_access.log
      KONG_PORTAL_API_ERROR_LOG: /var/kong/logs/portalapi_error.log
      KONG_PORTAL_GUI_ACCESS_LOG: /var/kong/logs/portalgui_access.log
      KONG_PORTAL_GUI_ERROR_LOG: /var/kong/logs/portalgui_error.log
      KONG_STATUS_ACCESS_LOG: /var/kong/logs/status_access.log
      KONG_STATUS_ERROR_LOG: /var/kong/logs/status_error.log
    volumes:
      - /etc/kong/ssl:/var/kong/certs
      - /etc/kong/logs:/var/kong/logs 
    ports:
      - "8000:8000/tcp"
      - "8443:8443/tcp"
      - "8001:8001/tcp"

networks:
  kong-konnect:
    name: kong-konnect
    driver: bridge
