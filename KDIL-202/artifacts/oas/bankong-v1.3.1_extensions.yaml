openapi: 3.0.2
info:
  title: Transactions API of BanKonG
  version: 1.3.1
  contact: 
    email: learn@konghq.com
  description: | 
    This API provides you access to the transactions of a logged in user. You can get, create, change and delete transactions (of course always depending on permissions).

x-kong-name: bankong
x-kong-service-defaults:
  retries: 10
  connect_timeout: 30000
  write_timeout: 30000
  read_timeout: 30000
  host: ${{ env "DECK_FQDN" }}
  path: /api/v1/
  port: 3000
x-kong-upstream-defaults:
  hash_on: ip
  healthchecks:
    passive:
      unhealthy:
        http_failures: 3
        tcp_failures: 3
        timeouts: 3
x-kong-plugin-key-auth:
  enabled: true
  config:
    key_names: [api_key, apikey]
    key_in_body: false
    hide_credentials: true

servers: 
  - url: http://localhost:3000/api/v1
    description: Local Test API Server
  
paths:
  /transactions:
    get:
      x-kong-name: alltransactions
      x-kong-plugin-rate-limiting:
        name: rate-limiting
        config:
          second: 2
          minute: 5
          policy: local
      description: Lists all transactions
      operationId: "listTranactions"
      summary: List all transactions
      tags: ["Transactions"]
      responses:
        "200":
          description: List of transactions
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TransactionsList"
              examples:
                 response:
                   value:
                     - id: 10
                       source: JA872659435350353
                       senderName: Donald Duck
                       destination: IR8412325587359375895
                       amount: 1000.00
                       currency: YEN
                       subject: "Invoice #10-15/12"
    post:
      description: Initiate a transaction
      operationId: "initiateTransaction"
      summary: Create new transaction
      tags: ["Transactions"]
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/Transaction"
      responses:
        "200":
          description: initiated transaction
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      description: Returns a post by id
      operationId: "getTransaction"
      summary: Get specific transaction
      tags: ["Transactions"]
      parameters:
        - name: id
          in: path
          required: true
          description: The transaction id.
          schema:
            $ref: "#/components/schemas/TransactionId"
      responses:
        "200":
          description: Transaction received
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
    delete:
      description: Cancel a transaction
      summary: Cancel a transaction
      tags: ["Transactions"]
      operationId: "cancelTransaction"
      parameters:
        - name: id
          in: path
          required: true
          description: The transaction id.
          schema:
            $ref: "#/components/schemas/TransactionId"
      responses:
        "200":
          description: Transaction cancelled
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found

components:
  schemas:
    TransactionId:
      type: "integer"
      description: "Unique identifier for the transaction. This identifier is both unique and immutable."    
      example: 42
    TransactionsList:
      "type": "array"
      "items":
        $ref: "#/components/schemas/Transaction"
    Transaction:
      "type": "object"
      "required":
        - "id"
        - "source"
        - "senderName"
        - "destination"
        - "amount"
        - "currency"
        - "subject"
      "properties":
        id:
          $ref: "#/components/schemas/TransactionId"
        source:
          type: "string"
          description: "The IBAN of the sending account"
          pattern: "^[a-zA-Z]{2}[0-9]{2}[a-zA-Z0-9]{4}[0-9]{7}([a-zA-Z0-9]?){0,16}$"
        senderName:
          type: "string"
        destination:
          type: "string"
          description: "The IBAN of the receiving account"
          pattern: "^[a-zA-Z]{2}[0-9]{2}[a-zA-Z0-9]{4}[0-9]{7}([a-zA-Z0-9]?){0,16}$"
        amount:
          description: "The amount of the transaction. Cannot be negative"
          type: number
          minimum: 0.01
          multipleOf: 0.01
        currency:
          description: "A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217"
          type: "string"
          pattern: "^[A-Z]{3,3}$"
        subject:
          type: "string"
          description: "Description that may be available for the statement fee."
          minLength: 0
          maxLength: 128

tags:
  - name: Transactions
    description: A tag
    