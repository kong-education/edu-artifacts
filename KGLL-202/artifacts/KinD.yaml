kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kongacademy
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /home/ubuntu
    containerPath: /mnt/host-ubuntu
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30000
    hostPort: 8000 # Proxy
    protocol: TCP
  - containerPort: 30443
    hostPort: 8443 # Proxy
    protocol: TCP
  - containerPort: 30001
    hostPort: 8001 # Admin api
    protocol: TCP
  - containerPort: 30501
    hostPort: 8444 # Admin api
    protocol: TCP
  - containerPort: 30002
    hostPort: 8002 # Manager
    protocol: TCP
  - containerPort: 30500
    hostPort: 8445 # Manager
    protocol: TCP