---
apiServer:
  auth:
    allowFromLocalhost: true
    clientCertsDir: "/etc/kong/ssl"
  authn:
    type: tokens
  corsAllowedDomains:
    - ".*"
  http:
    enabled: true
    interface: 0.0.0.0
    port: 5681
  https:
    enabled: true
    interface: 0.0.0.0
    port: 5682
    tlsCertFile: "/etc/kong/ssl/universalCP.crt"
    tlsKeyFile: "/etc/kong/ssl/universalCP.key"
  readOnly: false
bootstrapServer:
  apiVersion: v3
  params:
    adminAccessLogPath: "/dev/null"
    adminAddress: 127.0.0.1
    adminPort: 9902
    xdsConnectTimeout: 1s
    xdsHost: ''
    xdsPort: 5678
defaults:
  skipMeshCreation: false
diagnostics:
  debugEndpoints: false
  serverPort: 5680
dnsServer:
  CIDR: 240.0.0.0/4
  domain: mesh
  port: 5353
dpServer:
  auth:
    type: dpToken
  hds:
    checkDefaults:
      healthyThreshold: 1
      interval: 1s
      noTrafficInterval: 1s
      timeout: 2s
      unhealthyThreshold: 1
    enabled: true
    interval: 5s
    refreshInterval: 10s
  port: 5678
  tlsCertFile: "/etc/kong/ssl/universalCP.crt"
  tlsKeyFile: "/etc/kong/ssl/universalCP.key"
environment: universal
general:
  dnsCacheTTL: 10s
  tlsCertFile: "/etc/kong/ssl/universalCP.crt"
  tlsKeyFile: "/etc/kong/ssl/universalCP.key"
  workDir: "/etc/kong/.kuma"
guiServer:
  apiServerUrl: ''
metrics:
  dataplane:
    enabled: true
    subscriptionLimit: 10
  mesh:
    maxResyncTimeout: 20s
    minResyncTimeout: 1s
  zone:
    enabled: true
    subscriptionLimit: 10
mode: zone
monitoringAssignmentServer:
  assignmentRefreshInterval: 1s
  grpcPort: 5676
multizone:
  global:
    kds:
      grpcPort: 5685
      refreshInterval: 1s
      tlsCertFile: "/etc/kong/ssl/universalCP.crt"
      tlsKeyFile: "/etc/kong/ssl/universalCP.key"
      zoneInsightFlushInterval: 10s
    pollTimeout: 500ms
  zone:
    globalAddress: grpcs://$STRIGO_RESOURCE_0_DNS:30001
    kds:
      refreshInterval: 1s
      rootCaFile: "/etc/kong/ssl/ca.crt"
    name: universal-zone
reports:
  enabled: true
runtime:
  kubernetes:
    admissionServer:
      address: ''
      certDir: ''
      port: 5443
    controlPlaneServiceName: kuma-control-plane
    injector:
      builtinDNS:
        port: 15053
      caCertFile: ''
      cniEnabled: false
      exceptions:
        labels:
          openshift.io/build.name: "*"
          openshift.io/deployer-pod-for.name: "*"
      initContainer:
        image: kuma/kuma-init:$KONG_MESH_VERSION
      sidecarContainer:
        adminPort: 9901
        drainTime: 5s
        envVars: {}
        gid: 5678
        image: kuma/kuma-dp:$KONG_MESH_VERSION
        livenessProbe:
          failureThreshold: 12
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          failureThreshold: 12
          initialDelaySeconds: 1
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        redirectPortInbound: 15006
        redirectPortInboundV6: 15010
        redirectPortOutbound: 15001
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        uid: 5678
      sidecarTraffic:
        excludeInboundPorts: []
        excludeOutboundPorts: []
      virtualProbesEnabled: true
      virtualProbesPort: 9000
    marshalingCacheExpirationTime: 5m0s
  universal:
    dataplaneCleanupAge: 0h15m0s
    drainTime: '5'
sdsServer:
  dataplaneConfigurationRefreshInterval: 1s
store:
  cache:
    enabled: true
    expirationTime: 1s
  kubernetes:
    systemNamespace: kuma-system
  postgres:
    connectionTimeout: 5
    dbName: kuma
    host: localhost
    maxOpenConnections: 0
    maxReconnectInterval: 1m0s
    minReconnectInterval: 10s
    user: kuma
    password: kuma
    port: 5432
    tls:
      caPath: ''
      certPath: ''
      keyPath: ''
      mode: disable
  type: postgres
  upsert:
    conflictRetryBaseBackoff: 100ms
    conflictRetryMaxTimes: 5
xdsServer:
  dataplaneConfigurationRefreshInterval: 1s
  dataplaneStatusFlushInterval: 10s
  nackBackoff: 5s