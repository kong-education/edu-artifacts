_format_version: '3.0'
consumers:
  - keyauth_credentials:
      - key: jane-key
    username: Jane
services:
  - connect_timeout: 60000
    enabled: true
    host: flights.kongair
    name: kongair_flights_service
    plugins:
      - config:
          anonymous: null
          hide_credentials: false
          identity_realms:
            - id: null
              region: null
              scope: cp
          key_in_body: false
          key_in_header: true
          key_in_query: false
          key_names:
            - x-api-key
          realm: null
          run_on_preflight: true
        enabled: true
        name: key-auth
        protocols:
          - grpc
          - grpcs
          - http
          - https
          - ws
          - wss
      - config:
          day: null
          error_code: 429
          error_message: API rate limit exceeded
          fault_tolerant: true
          header_name: null
          hide_client_headers: false
          hour: null
          limit_by: ip
          minute: 5
          month: null
          path: null
          policy: local
          redis:
            database: 0
            host: null
            password: null
            port: 6379
            server_name: null
            ssl: false
            ssl_verify: false
            timeout: 2000
            username: null
          redis_database: 0
          redis_host: null
          redis_password: null
          redis_port: 6379
          redis_server_name: null
          redis_ssl: false
          redis_ssl_verify: false
          redis_timeout: 2000
          redis_username: null
          second: 3
          sync_rate: -1
          year: null
        enabled: true
        name: rate-limiting
        ordering:
          before:
            access:
              - key-auth
        protocols:
          - grpc
          - grpcs
          - http
          - https
    port: 8080
    protocol: http
    read_timeout: 60000
    retries: 5
    routes:
      - https_redirect_status_code: 426
        name: get_flights
        path_handling: v0
        paths:
          - /flights
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
    write_timeout: 60000
  - connect_timeout: 60000
    enabled: true
    host: routes.kongair
    name: kongair_routes_service
    port: 8080
    protocol: http
    read_timeout: 60000
    retries: 5
    routes:
      - https_redirect_status_code: 426
        name: get_flight_routes
        path_handling: v0
        paths:
          - /routes
        preserve_host: false
        protocols:
          - http
          - https
        regex_priority: 0
        request_buffering: true
        response_buffering: true
        strip_path: false
    write_timeout: 60000
