apiVersion: apps/v1
kind: Deployment
metadata:
  name: kongair-flights
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kongair-flights
  template:
    metadata:
      labels:
        app: kongair-flights
    spec:
      containers:
      - name: kongair-flights
        image: ghcr.io/battlebyte/kongair-flights:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kongair-flights
spec:
  selector:
    app: kongair-flights
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080