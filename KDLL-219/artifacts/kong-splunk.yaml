_format_version: "3.0"
consumers:
- keyauth_credentials:
  - key: "1234"
  username: user1
- keyauth_credentials:
  - key: "12345"
  username: user2
- keyauth_credentials:
  - key: "123456"
  username: user3
- keyauth_credentials:
  - key: "1234567"
  username: user4
- keyauth_credentials:
  - key: "12345678"
  username: user5
services:
- connect_timeout: 60000
  enabled: true
  host: mockbin.local
  name: bankong_transactions01
  path: /request
  plugins:
  - config:
      anonymous: null
      hide_credentials: false
      key_in_body: false
      key_in_header: true
      key_in_query: true
      key_names:
      - apikey
      run_on_preflight: true
    enabled: true
    name: key-auth
    protocols:
    - grpc
    - grpcs
    - http
    - https
    - ws
    - wss
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: bankong-list-tranactions01
    path_handling: v0
    paths:
    - /bankong-list-tranactions01
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
  write_timeout: 60000
