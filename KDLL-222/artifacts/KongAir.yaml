_format_version: "3.0"
_konnect:
  control_plane_name: flights-team
services:
- connect_timeout: 60000
  enabled: true
  host: flights.kongair
  name: flights-service
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: get-flights
    path_handling: v0
    paths:
    - /flights
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
- connect_timeout: 60000
  enabled: true
  host: routes.kongair
  name: routes-service
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: get-routes
    path_handling: v0
    paths:
    - /routes
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    tags:
    - dev-tag
  tags:
  - dev-tag    
  write_timeout: 60000