apiVersion: apps/v1
kind: Deployment
metadata:
  name: kongair-experience
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kongair-experience
  template:
    metadata:
      labels:
        app: kongair-experience
    spec:
      containers:
      - name: kongair-experience
        image: ghcr.io/battlebyte/kongair-experience:latest
        ports:
        - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: kongair-experience
spec:
  selector:
    app: kongair-experience
  ports:
  - protocol: TCP
    port: 8084
    targetPort: 8084