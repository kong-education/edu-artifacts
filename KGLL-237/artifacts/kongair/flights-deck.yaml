_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: httproute.kong.kongair-flights.0
  name: flights-service
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: get-flights
    path_handling: v0
    paths:
    - /flights
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
