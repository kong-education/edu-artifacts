apiVersion: apps/v1
kind: Deployment
metadata:
  name: kongair-routes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kongair-routes
  template:
    metadata:
      labels:
        app: kongair-routes
    spec:
      containers:
      - name: kongair-routes
        image: ghcr.io/battlebyte/kongair-routes:latest
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: kongair-routes
spec:
  selector:
    app: kongair-routes
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081