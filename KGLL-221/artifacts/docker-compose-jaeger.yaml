networks:
  kong-edu-net:
    name: kong-edu-net
    driver: bridge
    external: true

services:
  jaeger-collector:
    networks:
    - kong-edu-net
    image: jaegertracing/all-in-one:1.47.0
    hostname: jaeger-collector
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
      - COLLECTOR_OTLP_ENABLED=true
