- connect_timeout: 60000
  enabled: true
  host: api.kong-air.com
  name: flights-service
  path: /
  plugins:
  - config:
      anonymous: null
      hide_credentials: false
      key_in_body: false
      key_in_header: true
      key_in_query: true
      key_names:
      - apikey
      run_on_preflight: true
    enabled: true
    name: key-auth
    protocols:
    - grpc
    - grpcs
    - http
    - https
    - ws
    - wss
  port: 443
  protocol: https
  read_timeout: 60000
