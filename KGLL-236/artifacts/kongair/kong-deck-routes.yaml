_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: httproute.kong.kongair-routes.0
  name: httproute.kong.kongair-routes.0
  port: 5053
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: httproute.kong.kongair-routes.0.0
    path_handling: v0
    paths:
    - ~/routes$
    - /routes/
    preserve_host: true
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    tags:
    - k8s-name:kongair-routes
    - k8s-namespace:kong
    - k8s-kind:HTTPRoute
    - k8s-group:gateway.networking.k8s.io
    - k8s-version:v1
  tags:
  - k8s-name:kongair-routes
  - k8s-namespace:kong
  - k8s-kind:Service
  - k8s-version:v1
  write_timeout: 60000
upstreams:
- algorithm: round-robin
  hash_fallback: none
  hash_on: none
  hash_on_cookie_path: /
  healthchecks:
    active:
      concurrency: 10
      healthy:
        http_statuses:
        - 200
        - 302
        interval: 0
        successes: 0
      http_path: /
      https_verify_certificate: true
      timeout: 1
      type: http
      unhealthy:
        http_failures: 0
        http_statuses:
        - 429
        - 404
        - 500
        - 501
        - 502
        - 503
        - 504
        - 505
        interval: 0
        tcp_failures: 0
        timeouts: 0
    passive:
      healthy:
        http_statuses:
        - 200
        - 201
        - 202
        - 203
        - 204
        - 205
        - 206
        - 207
        - 208
        - 226
        - 300
        - 301
        - 302
        - 303
        - 304
        - 305
        - 306
        - 307
        - 308
        successes: 0
      type: http
      unhealthy:
        http_failures: 0
        http_statuses:
        - 429
        - 500
        - 503
        tcp_failures: 0
        timeouts: 0
    threshold: 0
  name: httproute.kong.kongair-routes.0
  slots: 10000
  tags:
  - k8s-name:kongair-routes
  - k8s-namespace:kong
  - k8s-kind:Service
  - k8s-version:v1
  targets:
  - target: 10.244.0.7:8080
    weight: 1
  use_srv_name: false
