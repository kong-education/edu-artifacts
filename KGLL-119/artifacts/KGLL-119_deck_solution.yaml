_format_version: "3.0"
consumers:
- keyauth_credentials:
  - key: routeskey
  username: flight_routes_user
- keyauth_credentials:
  - key: flightskey
  username: flights_user
plugins:
- config:
    anonymous: null
    hide_credentials: false
    key_in_body: false
    key_in_header: true
    key_in_query: true
    key_names:
    - apikey
    run_on_preflight: true
  enabled: true
  name: key-auth
  protocols:
  - grpc
  - grpcs
  - http
  - https
  - ws
  - wss
services:
- connect_timeout: 60000
  enabled: true
  host: flights.kongair
  name: kongair_flights_service
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: get_all_flights
    path_handling: v0
    paths:
    - /flights
    preserve_host: false
    protocols:
    - http
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000
- connect_timeout: 60000
  enabled: true
  host: routes.kongair
  name: kongair_routes_service
  port: 8080
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: get_flight_routes
    path_handling: v0
    paths:
    - /routes
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000