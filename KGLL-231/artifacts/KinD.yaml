kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kongacademy
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /home/ubuntu
    containerPath: /mnt/host-ubuntu
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 30000
    hostPort: 80 # Proxy
    protocol: TCP
  - containerPort: 30443
    hostPort: 443 # Proxy
    protocol: TCP
  - containerPort: 30001
    hostPort: 30001 # Admin api
    protocol: TCP
  - containerPort: 30501
    hostPort: 30501 # Admin api
    protocol: TCP
  - containerPort: 30002
    hostPort: 30002 # Manager
    protocol: TCP
  - containerPort: 30500
    hostPort: 30500 # Manager
    protocol: TCP
  - containerPort: 5050
    hostPort: 8050 # KongAir Experience
    protocol: TCP
  - containerPort: 5051
    hostPort: 8051 # KongAir Customers
    protocol: TCP
  - containerPort: 5052
    hostPort: 8052 # KongAir Flights
    protocol: TCP
  - containerPort: 5053
    hostPort: 8053 # KongAir Routes
    protocol: TCP
  - containerPort: 5054
    hostPort: 8054 # KongAir Bookings
    protocol: TCP